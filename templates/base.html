<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Earth Movers Admin' }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb}.navbar{background:#111827}.navbar a{color:#fff}.card{border:0;box-shadow:0 3px 15px #0000000b}.table th{white-space:nowrap}.stat{font-size:28px;font-weight:700}.btn{border-radius:8px}.brand{font-weight:800}.muted{color:#6b7280}</style></head><body><nav class="navbar navbar-expand-lg"><div class="container"><a class="navbar-brand brand" href="{{ url_for('dashboard') }}">Sevarkodi Earth Movers</a><div class="navbar-nav ms-auto"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a><a class="nav-link" href="{{ url_for('customers') }}">Customers</a><a class="nav-link" href="{{ url_for('drivers') }}">Operators</a><a class="nav-link" href="{{ url_for('vehicles') }}">Vehicles</a><a class="nav-link" href="{{ url_for('rates') }}">Rates</a><a class="nav-link" href="{{ url_for('reports') }}">Reports</a><a class="nav-link" href="{{ url_for('add_work') }}">+ Work</a><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></div></div></nav><main class="container py-4">{% with messages=get_flashed_messages() %}{% if messages %}{% for m in messages %}<div class="alert alert-success">{{m}}</div>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
