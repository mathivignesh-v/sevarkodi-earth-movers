{% extends 'base.html' %}{% block content %}<h2>{{title}}</h2><div class="card p-4 mt-3"><form method="post"><label>Name</label><input class="form-control mb-3" name="name" value="{{customer.name if customer else ''}}" required><label>Phone</label><input class="form-control mb-3" name="phone" value="{{customer.phone if customer else ''}}"><label>Address</label><input class="form-control mb-3" name="address" value="{{customer.address if customer else ''}}"><label>Status</label><select class="form-select mb-3" name="status"><option {% if not customer or customer.status=='Active' %}selected{% endif %}>Active</option><option {% if customer and customer.status=='Inactive' %}selected{% endif %}>Inactive</option></select><button class="btn btn-dark">Save</button></form></div>{% endblock %}
