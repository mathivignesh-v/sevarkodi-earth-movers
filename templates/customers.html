{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Customers</h2><a class="btn btn-dark" href="{{url_for('add_customer')}}">Add Customer</a></div><div class="card p-3"><table class="table"><tr><th>Name</th><th>Phone</th><th>Address</th><th>Status</th><th>Action</th></tr>{% for c in customers %}<tr><td>{{c.name}}</td><td>{{c.phone}}</td><td>{{c.address}}</td><td>{{c.status}}</td><td><a class="btn btn-sm btn-outline-primary" href="{{url_for('edit_customer',customer_id=c.id)}}">Edit</a> <form class="d-inline" method="post" action="{{url_for('delete_customer',customer_id=c.id)}}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete customer?')">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
