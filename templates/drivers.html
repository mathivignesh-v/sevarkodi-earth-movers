{% extends "base.html" %}
{% set title = "Drivers" %}
{% block content %}
<div class="toolbar">
  <div class="search">⌕ <input id="search" oninput="filterCards()" placeholder="Search driver"></div>
  <a class="btn" href="{{ url_for('add_driver') }}">+ Add Driver</a>
</div>
<div class="cards" id="cards">
{% for d in drivers %}
  <a class="person-card" data-name="{{ d.name|lower }}" href="{{ url_for('driver_detail', driver_id=d.id) }}">
    <div class="avatar">{{ d.name[0] }}</div>
    <div class="person-main"><b>{{ d.name }}</b><span>{{ d.phone }}</span><small>{{ "%.1f"|format(d.total_hours) }} hours · {{ d.total_amount|inr }}</small></div>
    <span class="status {{ 'active-status' if d.status=='Active' else 'inactive-status' }}">{{ d.status }}</span><span class="arrow">›</span><form method="post" action="{{ url_for('delete_driver', driver_id=d.id) }}" class="delete-form" onclick="event.stopPropagation()" onsubmit="return confirm('Delete this driver? This is allowed only if the driver has no work records.');"><button class="delete-btn" type="submit">Delete</button></form>
  </a>
{% endfor %}
</div>
{% endblock %}
