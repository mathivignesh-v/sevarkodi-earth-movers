{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Operators</h2><a class="btn btn-dark" href="{{url_for('add_driver')}}">Add Operator</a></div><div class="card p-3"><table class="table"><tr><th>Name</th><th>Phone</th><th>Status</th><th>Total Hours</th><th>Total Amount</th><th>Action</th></tr>{% for d in drivers %}<tr><td><a href="{{url_for('driver_detail',driver_id=d.id)}}">{{d.name}}</a></td><td>{{d.phone}}</td><td>{{d.status}}</td><td>{{d.total_hours|hours_fmt}}</td><td>{{d.total_amount|inr}}</td><td><a class="btn btn-sm btn-outline-primary" href="{{url_for('driver_detail',driver_id=d.id)}}">History</a></td></tr>{% endfor %}</table></div>{% endblock %}
