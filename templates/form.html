{% extends 'base.html' %}{% block content %}<h2>{{title}}</h2><div class="card p-4 mt-3"><form method="post">{% if kind=='driver' %}<label>Name</label><input class="form-control mb-3" name="name" required><label>Phone</label><input class="form-control mb-3" name="phone" required><label>Status</label><select class="form-select mb-3" name="status"><option>Active</option><option>Inactive</option></select>{% else %}<label>Vehicle Number</label><input class="form-control mb-3" name="number" required><label>Vehicle Type</label><input class="form-control mb-3" name="type" placeholder="JCB 3DX / Tipper / Tractor" required><label>Initial Rate / Hour</label><input class="form-control mb-3" type="number" name="rate_per_hour" min="0" value="0"><label>Status</label><select class="form-select mb-3" name="status"><option>Idle</option><option>Working</option></select>{% endif %}<button class="btn btn-dark">Save</button></form></div>{% endblock %}
