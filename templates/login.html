<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login - Sevarkodi Earth Movers</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{min-height:100vh;background:radial-gradient(circle at 20% 15%,rgba(245,180,0,.18),transparent 28%),linear-gradient(135deg,#0d1825,#29435d);font-family:Inter,system-ui,sans-serif}
.card{border:0;border-radius:24px;box-shadow:0 25px 70px rgba(0,0,0,.28)}
.logo{width:210px;height:150px;object-fit:contain}
.btn-login{background:linear-gradient(135deg,#ffc928,#d88f00);border:0;color:#18202a;font-weight:800;border-radius:12px;padding:.75rem}
.form-control{border-radius:11px;padding:.75rem}
</style></head>
<body><div class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
<div class="card p-4 p-md-5 w-100" style="max-width:460px">
<div class="text-center"><img src="{{ url_for('static', filename='logo.png') }}" class="logo" alt="Sevarkodi Earth Movers"><h3 class="fw-bold mb-1">Admin Login</h3><p class="text-muted mb-4">Earth Movers Management System</p></div>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post"><label>Username</label><input class="form-control mb-3" name="username" required><label>Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-login w-100">Sign In <span class="ms-1">→</span></button></form>
</div></div></body></html>
