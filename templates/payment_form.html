{% extends 'base.html' %}{% block content %}
<div class="row justify-content-center"><div class="col-xl-7">
<div class="mb-4"><h2 class="page-title mb-1">{{ title }}</h2><div class="muted">Update the payment amount or date. The customer balance will be recalculated automatically.</div></div>
<div class="card p-4 p-lg-5">
<form method="post">
  <div class="row g-3">
    <div class="col-md-6"><label>Payment Date</label><input class="form-control" type="date" name="payment_date" value="{{ payment.payment_date }}" required></div>
    <div class="col-md-6"><label>Payment Amount</label><input class="form-control" type="number" name="amount" value="{{ payment.amount }}" min="0.01" step="0.01" required></div>
    <div class="col-12"><label>Note</label><input class="form-control" name="note" value="{{ payment.note or '' }}"></div>
  </div>
  <div class="mt-4 d-flex gap-2"><button class="btn btn-brand"><i class="bi bi-check-lg me-1"></i>Save Payment</button><a class="btn btn-outline-secondary" href="{{ url_for('customer_detail',customer_id=payment.customer_id) }}">Cancel</a></div>
</form>
</div></div></div>
{% endblock %}
