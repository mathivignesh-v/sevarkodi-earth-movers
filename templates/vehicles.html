{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Vehicles / Machines</h2><a class="btn btn-dark" href="{{url_for('add_vehicle')}}">Add Vehicle</a></div><div class="card p-3"><table class="table"><tr><th>Number</th><th>Type</th><th>Status</th><th>Current Rate</th><th>Action</th></tr>{% for v in vehicles %}{% set r=query_rate(v.type) if false else none %}<tr><td>{{v.number}}</td><td>{{v.type}}</td><td>{{v.status}}</td><td>Manage in Rates</td><td><form method="post" action="{{url_for('delete_vehicle',vehicle_id=v.id)}}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete vehicle?')">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
