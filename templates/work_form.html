{% extends 'base.html' %}{% block content %}<h2>{{title}}</h2><div class="card p-4 mt-3"><form method="post"><div class="row g-3"><div class="col-md-4"><label>Customer</label><select class="form-select" name="customer_id"><option value="">Select customer</option>{% for c in customers %}<option value="{{c.id}}" {% if entry and entry.customer_id==c.id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></div><div class="col-md-4"><label>Operator</label><select class="form-select" name="driver_id" required>{% for d in drivers %}<option value="{{d.id}}" {% if entry and entry.driver_id==d.id %}selected{% endif %}>{{d.name}}</option>{% endfor %}</select></div><div class="col-md-4"><label>Vehicle / Machine</label><select class="form-select" name="vehicle_id" required>{% for v in vehicles %}<option value="{{v.id}}" {% if entry and entry.vehicle_id==v.id %}selected{% endif %}>{{v.number}} - {{v.type}}</option>{% endfor %}</select></div><div class="col-md-4"><label>Date</label><input class="form-control" type="date" name="work_date" value="{{entry.work_date if entry else ''}}" required></div><div class="col-md-4"><label>Start Time</label><input class="form-control" type="time" name="start_time" value="{{entry.start_time if entry else ''}}"></div><div class="col-md-4"><label>End Time</label><input class="form-control" type="time" name="end_time" value="{{entry.end_time if entry else ''}}"></div><div class="col-md-4"><label>Hours Worked</label><input class="form-control" type="number" min="0" step="0.01" name="hours" value="{{entry.hours if entry else ''}}" placeholder="Example: 8.5"><small class="text-muted">For JCB, tipper and tractor billing.</small></div><div class="col-md-4"><label>Rate / Hour (₹)</label><input class="form-control" type="number" min="0" step="0.01" name="rate_per_hour" value="{{entry.rate_per_hour if entry else ''}}" placeholder="Leave blank to use market rate"></div><div class="col-md-4"><label>Total Amount</label><input class="form-control" value="{{entry.amount|inr if entry else 'Calculated automatically'}}" disabled></div></div><div class="alert alert-info mt-4 mb-0">Amount = Hours × Rate per Hour. If rate is left blank, the current market rate for the selected machine type is used.</div><div class="mt-4"><button class="btn btn-dark">Save</button> <a class="btn btn-outline-secondary" href="{{url_for('reports')}}">Cancel</a></div></form></div>{% endblock %}
